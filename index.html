<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Agent Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#F2F4F6;--sheet:#fff;--ink:#10213A;--muted:#55667E;--line:#D5DCE5;--accent:#1F5FD1;--accent-ink:#fff;--ok:#1E8455;--ok-soft:#DDF2E7;
  --body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#0C141F;--sheet:#132033;--ink:#E5ECF5;--muted:#93A4BB;--line:#24364F;--accent:#6C9EFF;--accent-ink:#0C141F;--ok:#4FCB8F;--ok-soft:#12321F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);padding:32px 16px}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.6rem;margin:0}
.sub{color:var(--muted);margin:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.head span{color:var(--ok);font-size:.85rem;font-weight:500}
.msgs{height:460px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:.6em .85em;border-radius:12px;font-size:.95rem}
.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start}
.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.typing{color:var(--muted);font-family:var(--mono);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);min-height:58px}
.chip{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:.45em .8em;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:8px;padding:0 16px 16px}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:.6em .8em;font:inherit}
button[type=submit]{border:0;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 1em;font:inherit;font-weight:600;cursor:pointer}
.slip{border:1.5px solid var(--ink);border-radius:4px;font-size:.88rem}
.slip-head{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:.75rem;text-transform:uppercase}
.slip table{width:100%;border-collapse:collapse}
.slip td{padding:6px 12px;border-bottom:1px dashed var(--line);vertical-align:top}
.slip td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.slip small{display:block;color:var(--muted)}
.slip .tot td{border:0;padding-block:3px;color:var(--muted)}
.slip .grand td{font-weight:600;color:var(--ink);border-top:1.5px solid var(--ink);padding-top:8px}
.slip .note{padding:10px 12px;color:var(--muted);font-size:.82rem}
.slip .act{padding:0 12px 12px}
.slip .act button{border:0;background:var(--accent);color:var(--accent-ink);padding:.55em .9em;border-radius:4px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
.slip .act button[disabled]{background:var(--ok-soft);color:var(--ok);cursor:default}
footer{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Quote Agent Demo</h1>
  <p class="sub">An auto-repair quoting assistant that asks follow-up questions and builds an itemized estimate from a shop's price book. Demo shop and prices only.</p>
  <div class="card">
    <div class="head">Riverside Auto · Quote assistant <span>Demo</span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form"><input id="text" autocomplete="off" aria-label="Message" placeholder="Describe a car problem, e.g. my brakes squeal"><button type="submit">Send</button></form>
  </div>
  <footer>Built by <a href="https://github.com/xschaudhry">Chaudhry Usman</a> · TRXmode. Simulated data, no real customers.</footer>
</main>
<script src="src/price-book.js"></script>
<script src="src/engine.js"></script>
<script>
(() => {
  const { matchScenario, buildEstimate, priceBook: book } = window.QuoteEngine;
  const msgs = document.getElementById('msgs'), chips = document.getElementById('chips');
  const money = n => '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let state = {}, busy = false, estNo = 1046;

  function add(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who; d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
  }
  async function bot(text, ms = 800) { const t = add('typing…', 'bot typing'); await wait(ms); t.remove(); add(text, 'bot'); }
  function setChips(list) {
    chips.innerHTML = '';
    for (const [label, fn] of list) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = label;
      b.onclick = () => { if (!busy) fn(label); };
      chips.appendChild(b);
    }
  }
  async function step(fn) { busy = true; chips.innerHTML = ''; try { await fn(); } finally { busy = false; } }

  const startChips = () => setChips(Object.entries(book.scenarios).map(([k, s]) => [s.label, () => pick(k, s.label)]));

  function pick(key, said) {
    step(async () => {
      state = { scenario: key };
      add(said, 'me');
      await bot('Happy to help with that. What vehicle is it?');
      setChips(Object.entries(book.vehicles).map(([vk, v]) => [v.name, () => vehicle(vk)]));
    });
  }
  function vehicle(vk) {
    step(async () => {
      state.vehicle = vk; add(book.vehicles[vk].name, 'me');
      const s = book.scenarios[state.scenario];
      if (!s.question) return finish();
      await bot(s.question);
      setChips(Object.entries(s.options).map(([ak, o]) => [o.label, () => step(async () => { state.answer = ak; add(o.label, 'me'); await finish(); })]));
    });
  }
  async function finish() {
    const t0 = performance.now();
    await bot(`Thanks, building your estimate from ${book.shop.name}'s price book…`, 700);
    const e = buildEstimate(state);
    const rows = e.items.map(i => `<tr><td>${i.description}${i.kind === 'labor' ? ` <span style="color:var(--muted)">${i.hours} hr</span>` : i.qty > 1 ? ` <span style="color:var(--muted)">×${i.qty}</span>` : ''}${i.note ? `<small>${i.note}</small>` : ''}</td><td>${i.amount === 0 ? 'Free' : money(i.amount)}</td></tr>`).join('');
    const slip = document.createElement('div');
    slip.className = 'slip';
    slip.innerHTML = `<div class="slip-head"><span>Estimate #RA-${++estNo}</span><span>${e.vehicle}</span></div>
      <table>${rows}
        <tr class="tot"><td>Parts</td><td>${money(e.parts)}</td></tr>
        <tr class="tot"><td>Labor at $${book.shop.laborRate}/hr</td><td>${money(e.labor)}</td></tr>
        <tr class="tot"><td>Shop supplies</td><td>${money(e.supplies)}</td></tr>
        <tr class="tot"><td>Tax ${(book.shop.taxRate * 100).toFixed(2)}% on parts and supplies</td><td>${money(e.tax)}</td></tr>
        <tr class="grand"><td>Estimated total</td><td>${money(e.total)}</td></tr></table>
      <div class="note">${e.note}</div>
      <div class="act"><button type="button">Send to owner for approval</button></div>`;
    slip.querySelector('button').onclick = ev => { ev.target.disabled = true; ev.target.textContent = 'Sent to the owner. The customer gets it once approved.'; };
    msgs.appendChild(slip);
    add(`Drafted in ${((performance.now() - t0) / 1000).toFixed(1)} seconds · Demo prices`, 'typing');
    msgs.scrollTop = msgs.scrollHeight;
    setChips([['Try another problem', restart]]);
  }
  function restart() {
    step(async () => { msgs.innerHTML = ''; await bot(`Hi! I'm ${book.shop.name}'s quote assistant. Tell me what's going on with your car and I'll put together an estimate.`, 400); startChips(); });
  }
  document.getElementById('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const input = document.getElementById('text'), text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    const key = matchScenario(text);
    if (key) return pick(key, text);
    step(async () => { add(text, 'me'); await bot('This demo can quote brakes, AC, check engine lights and routine service. Pick one below.'); startChips(); });
  });
  restart();
})();
</script>
</body>
</html>
